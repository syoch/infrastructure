[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "portal"
version = "0.1.0"
description = "Android Device Provisioning Portal"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "python-multipart",
    "psycopg2",
    "jsonschema",
    "websockets"
]

[project.scripts]
portal-server = "backend.app:main"
portal-manage = "backend.manage:main"
portal-control-bridge = "portal_control_plane.bridge:main"
portal-opencode-tool = "portal_app_portal.opencode_tool:main"

[project.entry-points."portal.extensions"]
storage = "portal_storage:StorageManagerExtension"
obtainium = "portal_obtainium:ObtainiumRepoExtension"
control-plane = "portal_control_plane:ControlPlaneExtension"
app-portal = "portal_app_portal:AppPortalExtension"

[tool.setuptools]
packages = ["backend", "backend.core", "backend.utils", "backend.extensions", "portal_obtainium", "portal_control_plane", "portal_app_portal", "portal_storage"]

[tool.setuptools.package-dir]
backend = "backend"
"backend.core" = "backend/core"
"backend.utils" = "backend/utils"
"backend.extensions" = "backend/extensions"
portal_obtainium = "extensions/obtainium/portal_obtainium"
portal_control_plane = "extensions/control_plane/portal_control_plane"
portal_app_portal = "extensions/app_portal/portal_app_portal"
portal_storage = "extensions/storage/portal_storage"

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]

[tool.mypy]
python_version = "3.12"
mypy_path = ".:extensions/obtainium:extensions/control_plane:extensions/app_portal:extensions/storage"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = false
show_error_codes = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["tests/", "build/"]

